###################################################################################################
## PACKAGE: Entity Health (Unavailable + Frozen) v1.1
## DESCRIPTION: Two complementary monitors for entity health:
##   - Unavailable Entities (v2.4): count and list entities with state unknown/unavailable.
##     USAGE: https://github.com/jazzyisj/unavailable-entities-sensor/blob/main/README.md
##   - Frozen (stuck-value) Entities (v1.1): deteta sensores cujo VALOR não muda há demasiado
##     tempo (last_changed) — entidades "paradas" que continuam disponíveis. Expõe também
##     group.frozen_entities (entity_ids) para usar em cards/auto-entities.
## REQUIREMENTS: Home Assistant v2024.8
##
## NOTAS Frozen:
##   PORQUÊ last_changed e não last_reported: integrações como o Zigbee2MQTT continuam a
##     republicar valores antigos (ex.: o Aqara da bomba da piscina republica o tópico quando a
##     temperatura muda), por isso o last_reported avança na mesma. Só a estagnação do VALOR
##     denuncia a avaria.
##   LIMITES por device_class (segundos): tensão/frequência variam sempre num medidor vivo, logo
##     limite curto (3 h). O resto tem limite largo (6 h). Sensores a 0 (aparelho desligado) são
##     ignorados para os tipos elétricos.
##   IGNORAR uma entidade: junta-a ao group.ignored_frozen_entities OU aplica o label
##     "ignored_from_frozen".
###################################################################################################

###################################################################################################
## CONFIG — parâmetros ajustáveis do monitor Frozen (e o serviço de notificação).
## Estes helpers são o único sítio a editar. Mexes no `initial`, reinicias o HA e fica aplicado.
## (Também dá para ajustar na UI, mas o valor volta ao `initial` daqui em cada reinício.)
##   frozen_default_limit_hours  -> limite geral: quantas horas o VALOR pode ficar parado (6h)
##   frozen_tight_limit_hours    -> limite curto p/ tensão/frequência/fator de potência (3h)
##   frozen_notify_delay_minutes -> minutos com frozen>0 antes de notificar (15 min)
##   frozen_notify_service       -> serviço de notificação (ex.: notify.calvin); vazio = só
##                                  notificação persistente, sem notificação externa
###################################################################################################
input_number:
  frozen_default_limit_hours:
    name: "Frozen: limite geral (horas)"
    icon: mdi:timer-sand
    initial: 6
    min: 0.5
    max: 72
    step: 0.5
    unit_of_measurement: h
    mode: box
  frozen_tight_limit_hours:
    name: "Frozen: limite elétricos (horas)"
    icon: mdi:timer-sand
    initial: 3
    min: 0.5
    max: 48
    step: 0.5
    unit_of_measurement: h
    mode: box
  frozen_notify_delay_minutes:
    name: "Frozen: atraso da notificação (min)"
    icon: mdi:timer-cog-outline
    initial: 15
    min: 0
    max: 240
    step: 1
    unit_of_measurement: min
    mode: box

input_text:
  frozen_notify_service:
    name: "Frozen: serviço de notificação"
    icon: mdi:bell-cog-outline
    initial: notify.calvin
    max: 255

#REQUIRED - List of disabled device entities
command_line:
  sensor:
      name: Disabled Device Entities
      unique_id: disabled_device_entities
      json_attributes:
        - entities
      value_template: "{{ value_json.entities | length }}"
      command: 'jq ''.data.entities |= map(select(.disabled_by? != null) | {entity_id: .entity_id}) | del(.data.deleted_entities) | flatten | .[3]'' < .storage/core.entity_registry'

template:
  #REQUIRED - Count of unavailable entities
  - sensor:
      - name: "Unavailable Entities"
        unique_id: unavailable_entities
        icon: "{{ iif(states(this.entity_id)|int(-1) > 0, 'mdi:alert-circle', 'mdi:check-circle') }}"
        state_class: measurement
        state: >
          {% set entities = state_attr('group.unavailable_entities', 'entity_id') %}
          {{ entities | count if entities != none else -1 }}

  # Frozen (stuck-value) entities count + list
  - sensor:
      - name: "Frozen Entities"
        unique_id: frozen_entities
        icon: "{{ iif(states(this.entity_id)|int(0) > 0, 'mdi:timer-alert-outline', 'mdi:timer-check-outline') }}"
        state_class: measurement
        # Single source of truth: the detection runs once in the `entities`
        # attribute below and the state is just its length. Using this.attributes
        # reads the value rendered on the previous cycle, so the count lags the
        # list by at most one render — negligible since this sensor re-renders
        # whenever any sensor.* changes. Avoids duplicating the whole algorithm.
        state: "{{ (this.attributes.entities | default([])) | count }}"
        attributes:
          entities: >
            {% set default_limit = states('input_number.frozen_default_limit_hours')|float(6) * 3600 %}
            {% set tlim = states('input_number.frozen_tight_limit_hours')|float(3) * 3600 %}
            {% set tight = {'voltage': tlim, 'frequency': tlim, 'power_factor': tlim} %}
            {% set zero_skip = ['power','current','energy','apparent_power','reactive_power'] %}
            {% set watched_sc = ['measurement','total','total_increasing'] %}
            {% set ignore = state_attr('group.ignored_frozen_entities','entity_id') or [] %}
            {% set ignore_lbl = label_entities('ignored_from_frozen') if 'ignored_from_frozen' in labels() else [] %}
            {% set ns = namespace(items=[]) %}
            {% for s in states.sensor %}
              {% set dc = s.attributes.get('device_class') %}
              {% if s.attributes.get('state_class') in watched_sc
                    and s.state not in ['unknown','unavailable','none','']
                    and s.entity_id not in ignore
                    and s.entity_id not in ignore_lbl
                    and not (dc in zero_skip and s.state|float(-999) == 0) %}
                {% set limit = tight.get(dc, default_limit) %}
                {% set age = (now() - s.last_changed).total_seconds() %}
                {% if age > limit %}
                  {% set ns.items = ns.items + ['%s (%.1fh)' | format(s.entity_id, age/3600)] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}
          # Raw entity_ids (age suffix stripped) so they can feed a real group.
          # Derived from `entities` above — no second detection pass.
          entity_ids: >
            {{ this.attributes.entities | default([])
               | map('regex_replace', ' \(.*$', '') | list }}

group:
  #REQUIRED - Group of individually ignored entities (unavailable)
  ignored_entities:
    entities:
      - switch.ir_learn_ir_code
      - text.ir_ir_code_to_send
      - sensor.cube_one_action_angle
      - sensor.cube_one_action_to_side
      - sensor.cube_one_action_from_side
      - sensor.cube_one_action_side
      - sensor.freeds_5704_ac_current
      - sensor.freeds_5704_ac_frequency
      - sensor.freeds_5704_ac_voltage
      - sensor.freeds_5704_grid_voltage
      - sensor.freeds_5704_inverter_line_1_power
      - sensor.freeds_5704_inverter_line_2_power
      - sensor.freeds_5704_power_factor
      - sensor.freeds_5704_custom_temperature
      - device_tracker.galaxy_watch4_jgph
      - device_tracker.delmar_zflip6
      - device_tracker.galaxy_watch6_p5vp
      - device_tracker.galaxy_watch7
      - sensor.button_two_action_rate
      - sensor.button_two_action_step_size
      - sensor.button_two_action_transition_time
      - sensor.button_five_action_rate
      - sensor.button_five_action_step_size
      - sensor.button_five_action_transition_time
      - input_select.zigbee2mqtt_remove_select
      - input_select.zigbee2mqtt_old_name_select
      - person.mariadelmar
      - sensor.button_green1_payload

  # Grupo de entidades a ignorar (frozen). Acrescenta aqui sensores que ficam legitimamente
  # parados. Inclui os próprios contadores para não se auto-detetarem quando ficam a 0 muito tempo.
  ignored_frozen_entities:
    name: Ignored Frozen Entities
    entities:
      - sensor.frozen_entities
      - sensor.unavailable_entities
      - sensor.disabled_device_entities

automation:
  #REQUIRED - Create and update the monitored entities group. Updates once per minute.
  - id: update_unavailable_entities_group
    alias: "Update Unavailable Entities Group"
    description: "Update unavailable entities group."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: call_service
        event_data:
          domain: group
          service: reload

      - trigger: time_pattern
        minutes: "/1"
    actions:
      - action: group.set
        data:
          object_id: unavailable_entities
          entities: >
            {% set ignore_seconds = 60 %}
            {% set ignore_label = 'ignored_from_unavailable' %}
            {% set ignored_domains = ['button', 'conversation', 'event', 'group', 'image',
                'input_button', 'input_text', 'remote', 'tts', 'scene', 'stt', 'update', 'media_player'] %}
            {% set ignore_ts = (now().timestamp() - ignore_seconds)|as_datetime %}
            {% set disabled_device_entities = state_attr('sensor.disabled_device_entities', 'entities')
                | regex_replace(find='\[|\]|\{|\}|\'entity_id\':', replace='') %}
            {% set ignored_devices = label_devices(ignore_label) %}
            {% set ignored_device_entities = namespace(value=[]) %}
            {% for device in ignored_devices %}
              {% set ignored_device_entities.value = ignored_device_entities.value + device_entities(device) %}
            {% endfor %}
            {{ states
                | rejectattr('domain', 'in', ignored_domains)
                | rejectattr('entity_id', 'in', disabled_device_entities)
                | rejectattr('entity_id', 'in', state_attr('group.ignored_entities', 'entity_id'))
                | rejectattr('entity_id', 'in', ['group.unavailable_entities', 'group.ignored_entities'])
                | rejectattr('entity_id', 'in', ignored_device_entities.value)
                | rejectattr('entity_id', 'in', label_entities(ignore_label))
                | rejectattr('last_changed', 'ge', ignore_ts)
                | selectattr('state', 'in', ['unknown', 'unavailable'])
                | rejectattr('entity_id', 'search', 'number.*_minimum_range')
                | rejectattr('entity_id', 'search', 'sensor.*_target_distance')
                | rejectattr('entity_id', 'search', 'number.smartplug.*_overload_protection')
                | rejectattr('entity_id', 'search', 'select.*_switch_type')
                | rejectattr('entity_id', 'search', 'select.*_indicator_mode')
                | rejectattr('entity_id', 'search', 'select.*_power_outage_memory')
                | rejectattr('entity_id', 'search', 'select.*_power_on_behavior')
                | rejectattr('entity_id', 'search', 'select.*_cleangenius')
                | rejectattr('entity_id', 'search', 'select.*_mop_extend_frequency')
                | rejectattr('entity_id', 'search', 'notify.*_text_to_speech')
                | rejectattr('entity_id', 'search', 'number.*_brightness')
                | rejectattr('entity_id', 'search', 'number.*_countdown')
                | rejectattr('entity_id', 'search', 'number.*_timer')
                | rejectattr('entity_id', 'search', 'sensor.*_foreground_app')
                | rejectattr('entity_id', 'search', 'sensor.*_current_page')
                | rejectattr('entity_id', 'search', 'sensor.*_orientation')
                | rejectattr('entity_id', 'search', 'sensor.*_free_memory')
                | rejectattr('entity_id', 'search', 'sensor.*_internal_storage_total_space')
                | rejectattr('entity_id', 'search', 'binary_sensor.*_admin')
                | rejectattr('entity_id', 'search', 'binary_sensor.*_kiosk_mode')
                | rejectattr('entity_id', 'search', 'binary_sensor.*_plugged_in')
                | rejectattr('entity_id', 'search', 'switch.*_screensaver')
                | rejectattr('entity_id', 'search', 'switch.*_kiosk_lock')
                | rejectattr('entity_id', 'search', 'switch.*_maintenance_mode')
                | rejectattr('entity_id', 'search', 'switch.*_clean_carpets_first')
                | rejectattr('entity_id', 'search', 'switch.*_cleaning_sequence')
                | rejectattr('entity_id', 'search', 'switch.*_floor_direction_cleaning')
                | rejectattr('entity_id', 'search', 'switch.*_intensive_carpet_cleaning')
                | rejectattr('entity_id', 'search', 'switch.*_multi_floor_map')
                | rejectattr('entity_id', 'search', 'select.*_selected_map')
                | rejectattr('entity_id', 'search', 'select.*_cleaning_mode')
                | rejectattr('entity_id', 'search', 'select.*_cleaning_route')
                | rejectattr('entity_id', 'search', 'select.*_cleaning_times')
                | rejectattr('entity_id', 'search', 'select.*_mop_pad_humidity')
                | rejectattr('entity_id', 'search', 'select.*_suction_level')
                | rejectattr('entity_id', 'search', 'select.*_floor_material_direction')
                | rejectattr('entity_id', 'search', 'select.*_order')
                | rejectattr('entity_id', 'search', 'select.*_cleangenius_mode')
                | rejectattr('entity_id', 'search', 'select.*_self_clean_frequency')
                | rejectattr('entity_id', 'search', 'select.*_floor_material')
                | rejectattr('entity_id', 'search', 'select.*_visibility')
                | rejectattr('entity_id', 'search', 'number.*_self_clean_time')
                | rejectattr('entity_id', 'search', 'number.*_self_clean_area')
                | rejectattr('entity_id', 'search', 'sensor.*_task_type')
                | rejectattr('entity_id', 'search', 'sensor.*_mapping_time')
                | rejectattr('entity_id', 'search', 'sensor.*_drying_progress')
                | rejectattr('entity_id', 'search', 'sensor.*_cleaning_progress')
                | rejectattr('entity_id', 'search', 'switch.*_intelligent_recognition')
                | rejectattr('entity_id', 'search', 'switch.*_ultra_clean_mode')
                | rejectattr('entity_id', 'search', 'switch.*_customized_cleaning')
                | rejectattr('entity_id', 'search', 'switch.*_max_suction_power')
                | rejectattr('entity_id', 'search', 'switch.*_pet_focused_detection')
                | rejectattr('entity_id', 'search', 'time.*_off_peak_charging_*')
                | rejectattr('entity_id', 'search', 'sensor.*tomorrow.*price')
                | rejectattr('entity_id', 'in', integration_entities('frigate'))
                | map(attribute='entity_id') | list | sort }}

  # Build/refresh group.frozen_entities from the sensor's entity_ids attribute.
  # Mirrors the unavailable group automation. Updates once per minute.
  - id: update_frozen_entities_group
    alias: "Update Frozen Entities Group"
    description: "Rebuild group.frozen_entities from sensor.frozen_entities."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: call_service
        event_data:
          domain: group
          service: reload

      - trigger: time_pattern
        minutes: "/1"
    actions:
      - action: group.set
        data:
          object_id: frozen_entities
          entities: "{{ state_attr('sensor.frozen_entities', 'entity_ids') or [] }}"

  #OPTIONAL - Example notfication automation to demonstrate how you can utilize this sensor. (See example folder for more.)
  - id: unavailable_entities_notification
    alias: "Unavailable Entities Notification"
    description: "Create persistent notification if unavailable entities, dismiss if none."
    mode: restart
    triggers:
      - trigger: state
        entity_id: group.unavailable_entities
        attribute: entity_id
        to: ~
        for: 5 # throttle triggers and prevent blank notifications
    conditions:
      - condition: template
        alias: "Sensor state is a valid numerical value"
        value_template: "{{ is_number(states('sensor.unavailable_entities')) }}"
    actions:
      - if:
          - condition: numeric_state
            entity_id: sensor.unavailable_entities
            below: 1
        then:
          - action: persistent_notification.dismiss
            data:
              notification_id: unavailable_entities
        else:
          - action: persistent_notification.create
            data:
              notification_id: unavailable_entities
              title: "Unavailable Entities"
              message: "{{ state_attr('group.unavailable_entities', 'entity_id') | join('\n') }}"

  # Frozen entities notifications
  - id: notify_frozen_entities
    alias: "Aviso: entidades com valor parado"
    description: "Notifica quando há sensores cujo valor não muda há demasiado tempo."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.frozen_entities
        above: 0
        for: "{{ states('input_number.frozen_notify_delay_minutes')|int(15) * 60 }}"
    actions:
      - variables:
          n: "{{ states('sensor.frozen_entities') }}"
          lista: "{{ state_attr('sensor.frozen_entities','entities') | join('\n- ') }}"
          notify_service: "{{ states('input_text.frozen_notify_service') }}"
      - action: persistent_notification.create
        data:
          notification_id: frozen_entities
          title: "⏱️ {{ n }} entidade(s) com valor parado"
          message: |
            Estes sensores não atualizam o valor há demasiado tempo:
            - {{ lista }}
      # Notificação externa só se o serviço estiver definido (campo vazio = desligado).
      - if: "{{ notify_service not in ['', 'unknown', 'unavailable', 'none'] }}"
        then:
          - action: "{{ notify_service }}"
            data:
              title: "HA: {{ n }} entidade(s) com valor parado"
              message: |
                Sensores parados há demasiado tempo:
                - {{ lista }}

  - id: clear_frozen_entities_notification
    alias: "Limpar aviso de entidades com valor parado"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: numeric_state
        entity_id: sensor.frozen_entities
        below: 1
        for:
          minutes: 5
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: frozen_entities
